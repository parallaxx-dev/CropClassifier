# Production-style single-host deployment -- the same file runs on a laptop
# or an EC2 instance (see DEPLOY.md). Built images, not source-mounted dev
# servers: use `npm run dev` / `uvicorn --reload` directly on the host for
# hot-reload dev work.
#
#   browser ──► frontend (nginx :80, published as ${HTTP_PORT}) ──/api/──► backend (:8000, internal only)
#
# Host-level settings (HTTP_PORT, data paths) come from an optional
# top-level .env (see .env.example); backend secrets come from backend/.env
# (see backend/.env.example).

x-logging: &default-logging
  # Docker's json-file driver keeps logs forever by default -- cap them so a
  # long-running instance doesn't slowly fill its root volume.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    image: cropclassifier-backend
    restart: unless-stopped
    env_file:
      - backend/.env  # CDSE_SH_CLIENT_ID / CDSE_SH_CLIENT_SECRET (gitignored, not baked into the image)
    # Not published on the host -- only reachable from the frontend's nginx
    # over the compose network.
    expose:
      - "8000"
    volumes:
      # Parcel geometry data for the Parcel Browser / Live Validation pages.
      # Gitignored (large training output / private data), so mounted
      # read-only from the host rather than baked into the image. If a path
      # doesn't exist the API still starts, just with fewer parcel regions.
      - ${PARCEL_GEOMS_DIR:-./backend/training/eurocrops_output/multi_country/checkpoints}:/app/training/eurocrops_output/multi_country/checkpoints:ro
      - ${LOCAL_PARCELS_DIR:-./backend/local_parcels}:/app/local_parcels:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    image: cropclassifier-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
