# react-router's BrowserRouter needs every unknown path (e.g. /draw,
# /live-validation on a hard refresh) served index.html instead of nginx's
# default 404 -- the client-side router takes it from there.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's 25MB MAX_UPLOAD_BYTES (services/aoi_upload.py)
    # with headroom for multipart overhead -- nginx's 1MB default would
    # reject /upload-aoi requests before they ever reach FastAPI.
    client_max_body_size 30m;

    # Same-origin reverse proxy to the backend container (the `backend`
    # service in docker-compose.yml, resolved on the compose network). The
    # browser only ever talks to this nginx: no CORS setup, no mixed-content
    # blocking once TLS terminates in front of it, and the backend port
    # never needs to be published on the host.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A live CDSE fetch + ensembled inference can run past nginx's 60s
        # default.
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
