# react-router's BrowserRouter needs every unknown path (e.g. /draw,
# /live-validation on a hard refresh) served index.html instead of nginx's
# default 404 -- the client-side router takes it from there.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the backend ALB. Avoids mixed-content
    # blocking when this page is served over HTTPS (e.g. via Cloudflare)
    # but the backend ALB only terminates plain HTTP -- a browser refuses
    # to fetch() http:// from an https:// page regardless of CORS headers,
    # so a relative /api/ path routed through this same nginx (still HTTP
    # on the wire to the backend, but same-origin from the browser's POV)
    # sidesteps the problem without needing a cert/DNS record for the API.
    location /api/ {
        proxy_pass http://cropclassifier-backend-alb-462326381.ap-south-1.elb.amazonaws.com/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
