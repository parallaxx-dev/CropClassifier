name: CD

# DISABLED: no longer runs on merges to main. Deploys now go through
# deploy/deploy-ec2.sh (builds on the instance from an exact commit), and
# the ECS service these images were for no longer exists. Kept runnable by
# hand (Actions -> CD -> Run workflow) in case pushing images to ECR is
# needed again; to re-enable automatic runs, restore:
#   on:
#     push:
#       branches: [main]
#
# Builds + pushes both images to ECR. The actual "redeploy the ECS service"
# step is intentionally left out below (see the TODO) -- pushing a new image
# tag alone doesn't make a running ECS service pick it up.
on:
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 842351889019.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: academics/cropclassifier

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Static keys for now (simplest to get working) -- consider migrating
      # to an OIDC role (aws-actions/configure-aws-credentials's role-to-assume)
      # later, so no long-lived AWS credentials need to live in GitHub Secrets
      # at all.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
          # frontend-only build arg; harmless no-op for the backend build.
          # Defaults to the relative path nginx proxies to the backend; set
          # the VITE_API_BASE repo variable only to bypass that proxy.
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE || '/api/v1' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # TODO once the ECS cluster + service exist (names known): add a step
      # here to actually roll the new image out, e.g.:
      #
      #   - name: Force new ECS deployment
      #     run: |
      #       aws ecs update-service \
      #         --cluster <cluster-name> \
      #         --service <service-name-for-this-matrix.service> \
      #         --force-new-deployment
      #
      # Until then, pushing :latest updates the image in ECR but does NOT
      # restart the running ECS task -- that needs an explicit redeploy.
