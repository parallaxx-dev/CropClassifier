name: CD

# Builds + pushes both images to ECR on every merge to main. The actual
# "redeploy the ECS service" step is intentionally left out below (see the
# TODO) until the ECS cluster/service exist and their names are known --
# pushing a new image tag alone doesn't make a running ECS service pick it
# up.
on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 842351889019.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: academics/cropclassifier

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Static keys for now (simplest to get working) -- consider migrating
      # to an OIDC role (aws-actions/configure-aws-credentials's role-to-assume)
      # later, so no long-lived AWS credentials need to live in GitHub Secrets
      # at all.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
          # frontend-only build arg; harmless no-op for the backend build.
          # Set the VITE_API_BASE repo variable once the backend's real ALB
          # URL exists (Settings -> Secrets and variables -> Actions -> Variables).
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # TODO once the ECS cluster + service exist (names known): add a step
      # here to actually roll the new image out, e.g.:
      #
      #   - name: Force new ECS deployment
      #     run: |
      #       aws ecs update-service \
      #         --cluster <cluster-name> \
      #         --service <service-name-for-this-matrix.service> \
      #         --force-new-deployment
      #
      # Until then, pushing :latest updates the image in ECR but does NOT
      # restart the running ECS task -- that needs an explicit redeploy.
