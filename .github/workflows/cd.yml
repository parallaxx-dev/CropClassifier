name: CD

# Deploys to a single EC2 host on every merge to main by SSHing in and
# running deploy/deploy.sh (git pull + docker compose up --build + health
# check) -- the same script you'd run by hand, so there's exactly one deploy
# path. Images are built on the host itself; no registry needed.
#
# Setup (Settings -> Secrets and variables -> Actions):
#   Variables: EC2_HOST (public IP / DNS), EC2_USER (ec2-user / ubuntu),
#              EC2_APP_DIR (repo checkout on the host, e.g. /home/ec2-user/CropClassifier)
#   Secrets:   EC2_SSH_KEY (private key whose public half is in the host's
#              ~/.ssh/authorized_keys)
# Until EC2_HOST is set the job is skipped, so merges don't fail on an
# unconfigured repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.EC2_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        run: |
          ssh -i ~/.ssh/id_deploy "$EC2_USER@$EC2_HOST" \
            "cd '$EC2_APP_DIR' && git fetch origin main && git checkout main && ./deploy/deploy.sh"
